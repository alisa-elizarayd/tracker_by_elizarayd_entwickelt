<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daily Tracker</title>
    <link rel="manifest" href="./manifest_tracker_cracker.json">
    <meta name="theme-color" content="#d633ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
    <style>
        :root {
            --grid-color: #e0e0e0;
            --bg-color: #f9f9f9;
            --primary: #d633ff;
            --text-dark: #333333;
            --text-light: #ffffff;
            --success: #22c55e;
            --success-dark: #16a34a;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 8px 15px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
        }

        h1 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: var(--primary);
            margin: 0;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            transform: rotate(-1deg);
            text-align: center;
            line-height: 1.1;
            white-space: nowrap;
        }

        .io-controls {
            display: flex;
            gap: 6px;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .io-btn {
            border: none;
            background: rgba(214, 51, 255, 0.1);
            color: var(--primary);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .io-btn:hover { background: rgba(214, 51, 255, 0.2); }
        .io-btn:active { transform: translateY(1px); }

        #workspace {
            flex: 1;
            position: relative;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
            margin: 0 10px 10px 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            touch-action: none;
        }

        #bin {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 70px;
            height: 70px;
            border: 2px dashed #999;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s ease;
            z-index: 10;
        }

        #bin.drag-over {
            background-color: #ffcccc;
            border-color: #ff0000;
            color: #ff0000;
            transform: scale(1.1);
        }

        .widget {
            position: absolute;
            width: 260px;
            height: 200px;
            min-width: 160px;
            min-height: 140px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.2s, border-color 0.3s;
            z-index: 5;
            box-sizing: border-box;
            touch-action: none;
            overflow: visible;
        }

        .widget.type-paperclip {
            background: #fffdf5;
            border-radius: 2px;
            border: 1px solid #e0e0e0;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.05), 5px 5px 15px rgba(0,0,0,0.1);
        }

        .paperclip-icon {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 50px;
            border: 3px solid #b0b0b0;
            border-radius: 15px 15px 5px 5px;
            border-bottom: none;
            z-index: 10;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2), 1px 1px 2px rgba(0,0,0,0.1);
            pointer-events: none;
        }

        .paperclip-icon::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 30px;
            border: 2px solid #999;
            border-radius: 10px 10px 3px 3px;
            border-bottom: none;
        }

        .widget-drag-handle {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35px;
            cursor: grab;
            z-index: 2;
            background: transparent;
        }

        .widget-drag-handle:active { cursor: grabbing; }

        .widget.dragging {
            opacity: 0.9;
            box-shadow: 10px 10px 25px rgba(0,0,0,0.3);
            z-index: 999;
        }

        .widget-content {
            flex: 1;
            outline: none;
            font-size: 14px;
            line-height: 1.3;
            color: inherit;
            overflow-y: auto;
            word-wrap: break-word;
            margin-top: 20px;
            cursor: text;
            z-index: 2;
            -webkit-user-select: text;
            user-select: text;
            touch-action: auto;
            min-height: 0;
            position: relative;
        }

        .done-btn {
            position: absolute;
            top: 50%;
            right: -22px;
            transform: translateY(-50%) scale(0.6);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--success);
            color: white;
            border: 3px solid white;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0;
            touch-action: manipulation;
        }

        .done-btn svg {
            width: 22px;
            height: 22px;
            stroke: white;
            stroke-width: 3.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .widget.active .done-btn {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .done-btn:hover {
            background: var(--success-dark);
            transform: translateY(-50%) scale(1.1);
        }

        .done-btn:active { transform: translateY(-50%) scale(0.95); }

        .done-overlay {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: linear-gradient(90deg, rgba(34,197,94,0) 0%, rgba(34,197,94,0.08) 40%, rgba(34,197,94,0.28) 75%, rgba(34,197,94,0.45) 100%);
        }

        .done-checkmark {
            position: absolute;
            top: 50%;
            right: 8%;
            transform: translate(0, -50%) rotate(-8deg) scale(0.4);
            width: clamp(38px, 45%, 110px);
            height: clamp(38px, 45%, 110px);
            color: var(--success-dark);
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
            z-index: 11;
        }

        .done-checkmark svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .widget.done .done-overlay { opacity: 1; }
        .widget.done .done-checkmark { opacity: 0.85; transform: translate(0, -50%) rotate(-8deg) scale(1); }
        .widget.done .widget-content { opacity: 0.55; transition: opacity 0.35s ease; }
        .widget.done .done-btn { background: white; color: var(--success-dark); border-color: var(--success); }
        .widget.done .done-btn svg { stroke: var(--success-dark); }
        .widget.done .done-btn:hover { background: var(--success); color: white; }
        .widget.done .done-btn:hover svg { stroke: white; }
        .widget.type-paperclip .done-btn { right: -18px; }
        .widget .resizer { z-index: 25; }

        .controls { display: none; flex-direction: column; gap: 5px; padding-top: 5px; border-top: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; z-index: 3; }
        .control-row { display: flex; gap: 4px; justify-content: space-between; align-items: center; }
        .widget.solid-mode.dark-theme .controls { border-top-color: rgba(255,255,255,0.2); }
        .widget.active .controls { display: flex; }
        .widget.active { box-shadow: 0 0 0 3px rgba(214,51,255,0.4); }
        .widget.type-paperclip.active { box-shadow: 0 0 0 3px rgba(214,51,255,0.4), 5px 5px 15px rgba(0,0,0,0.1); }

        button, .mode-toggle {
            border: none;
            background: rgba(150,150,150,0.15);
            color: inherit;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            min-width: 30px;
            touch-action: manipulation;
        }

        button:hover, .mode-toggle:hover { background: rgba(150,150,150,0.3); }
        .fmt-btn { font-family: 'Times New Roman', serif; font-size: 15px; flex: 1; }
        .fmt-btn.bold { font-weight: 900; }
        .fmt-btn.italic { font-style: italic; font-family: serif; }
        .fmt-btn.underline { text-decoration: underline; }
        .delete-btn { color: #d32f2f; }
        .widget.dark-theme .delete-btn { color: rgba(255,255,255,0.8); }
        .widget.dark-theme .delete-btn:hover { color: #fff; background: rgba(255,0,0,0.4); }
        .mode-toggle { font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; flex: 1.5; }

        input[type="color"] { -webkit-appearance: none; border: none; width: 30px; height: 30px; border-radius: 4px; cursor: pointer; padding: 0; background: transparent; overflow: hidden; flex-shrink: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(150,150,150,0.5); border-radius: 4px; }

        .resizer { width: 40px; height: 40px; background: transparent; position: absolute; right: 0; bottom: 0; cursor: se-resize; z-index: 20; display: flex; justify-content: flex-end; align-items: flex-end; padding: 6px; touch-action: none; }
        .resizer::after { content: ''; display: block; width: 12px; height: 12px; border-right: 3px solid rgba(150,150,150,0.6); border-bottom: 3px solid rgba(150,150,150,0.6); border-bottom-right-radius: 4px; transition: border-color 0.2s; }
        .widget:hover .resizer::after, .widget.active .resizer::after { border-color: #333; }
        .widget.dark-theme:hover .resizer::after, .widget.dark-theme.active .resizer::after { border-color: #fff; }

        .widget.type-square.solid-mode { box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.15), 2px 3px 8px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06); }
        .widget.type-square.solid-mode.dark-theme { box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -2px 6px rgba(0,0,0,0.4), 2px 3px 10px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.1); }
        .widget.type-square.solid-mode:not(.dark-theme) { border-color: rgba(0,0,0,0.08); }
        .widget.type-square.solid-mode.active { box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.15), 0 0 0 3px rgba(214,51,255,0.5), 2px 3px 8px rgba(0,0,0,0.18); }
        .widget.type-square.solid-mode.dark-theme.active { box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -2px 6px rgba(0,0,0,0.4), 0 0 0 3px rgba(214,51,255,0.6), 2px 3px 10px rgba(0,0,0,0.3); }

        #fab-container { position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 4px); right: calc(env(safe-area-inset-right,0px) + 4px); z-index: 100; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 12px; }
        #add-btn { width: 60px; height: 60px; border-radius: 50%; background-color: var(--primary); border: none; box-shadow: 0 4px 10px rgba(214,51,255,0.4); cursor: pointer; transition: transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275); display: flex; justify-content: center; align-items: center; position: relative; flex-shrink: 0; touch-action: manipulation; }
        #add-btn.active { transform: rotate(135deg); }
        #add-btn::before, #add-btn::after { content: ''; position: absolute; top: 50%; left: 50%; background-color: white; border-radius: 2px; pointer-events: none; transform: translate(-50%,-50%); }
        #add-btn::before { width: 24px; height: 4px; }
        #add-btn::after { width: 4px; height: 24px; }

        .fab-option { width: 150px; height: 50px; background: white; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: flex-start; padding-left: 15px; gap: 10px; cursor: pointer; opacity: 0; transform: translateY(20px) scale(0.8); pointer-events: none; transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275); font-weight: bold; color: #333; font-size: 13px; touch-action: manipulation; }
        .fab-option.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .icon-square { width: 20px; height: 20px; border: 2px solid #d633ff; border-radius: 4px; flex-shrink: 0; }
        .icon-paperclip { width: 20px; height: 20px; position: relative; flex-shrink: 0; }
        .icon-paperclip::before { content: '📎'; font-size: 18px; position: absolute; top: -3px; left: 0; }

        #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.2); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
        #overlay.visible { opacity: 1; pointer-events: auto; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0,0,0,0.85); color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 1000; transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275); pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.3); max-width: 90vw; text-align: center; }
        #toast.visible { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <header>
        <h1>Daily Tracker</h1>
        <div class="io-controls">
            <button class="io-btn" id="export-btn" title="Экспорт в файл">📤</button>
            <button class="io-btn" id="import-btn" title="Импорт из файла">📥</button>
            <button class="io-btn" id="clear-btn" title="Очистить доску">🗑️</button>
            <input type="file" id="file-input" accept=".json,application/json" style="display:none">
        </div>
    </header>
    <div id="workspace"><div id="bin">BIN</div></div>
    <div id="overlay"></div>
    <div id="toast"></div>
    <div id="fab-container">
        <div class="fab-option" id="opt-square"><div class="icon-square"></div>Обычный блок</div>
        <div class="fab-option" id="opt-paperclip"><div class="icon-paperclip"></div>Блок-скрепка</div>
        <button id="add-btn" title="Add New Block"></button>
    </div>
    <script>
        const workspace = document.getElementById('workspace');
        const bin = document.getElementById('bin');
        const addBtn = document.getElementById('add-btn');
        const overlay = document.getElementById('overlay');
        const optSquare = document.getElementById('opt-square');
        const optPaperclip = document.getElementById('opt-paperclip');
        const toast = document.getElementById('toast');
        const STORAGE_KEY = 'daily-tracker-board-v1';
        let highestZIndex = 10;
        let isFabOpen = false;

        function showToast(message, duration = 2000) { toast.textContent = message; toast.classList.add('visible'); clearTimeout(window._toastTimer); window._toastTimer = setTimeout(() => toast.classList.remove('visible'), duration); }
        function toggleFabMenu() { isFabOpen = !isFabOpen; addBtn.classList.toggle('active', isFabOpen); overlay.classList.toggle('visible', isFabOpen); optSquare.classList.toggle('visible', isFabOpen); optPaperclip.classList.toggle('visible', isFabOpen); }

        function createWidget(type = 'square', data = null) {
            if (isFabOpen) toggleFabMenu();
            const widget = document.createElement('div');
            widget.className = `widget type-${type}`;
            if (data && data.done) widget.classList.add('done');
            const paperclipHTML = type === 'paperclip' ? '<div class="paperclip-icon"></div>' : '';
            const x = data ? data.x : Math.max(20, Math.random() * (workspace.clientWidth - 280) + 20);
            const y = data ? data.y : Math.max(20, Math.random() * (workspace.clientHeight - 250) + 20);
            const width = data ? data.width : 260;
            const height = data ? data.height : 220;
            widget.style.left = `${x}px`;
            widget.style.top = `${y}px`;
            widget.style.width = `${width}px`;
            widget.style.height = `${height}px`;
            widget.style.zIndex = ++highestZIndex;
            const contentHTML = data ? data.html : (type === 'paperclip' ? 'Важная заметка...' : 'New Reminder...');
            const color = data ? data.color : (type === 'paperclip' ? '#ffffff' : '#d633ff');
            const mode = data ? data.mode : 'pastel';
            const userFontMultiplier = data ? (data.userFontMultiplier || 1) : 1;
            widget.dataset.mode = mode;
            widget.dataset.userFontMultiplier = userFontMultiplier;
            widget.innerHTML = `${paperclipHTML}<div class="done-overlay"></div><div class="done-checkmark" aria-hidden="true"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"></polyline></svg></div><div class="widget-drag-handle"></div><div class="widget-content" contenteditable="true" spellcheck="false">${contentHTML}</div><div class="controls"><div class="control-row format-controls"><button class="fmt-btn" data-action="font-minus" title="A-">A-</button><button class="fmt-btn" data-action="font-plus" title="A+">A+</button><button class="fmt-btn bold" data-action="bold" title="Bold">B</button><button class="fmt-btn italic" data-action="italic" title="Italic">I</button><button class="fmt-btn underline" data-action="underline" title="Underline">U</button></div><div class="control-row style-controls"><input type="color" class="color-picker" value="${color}" title="Color"><button class="mode-toggle" data-action="toggle-mode">${mode.toUpperCase()}</button><button class="delete-btn" data-action="delete" title="Delete">🗑️</button></div></div><div class="resizer"></div><button class="done-btn" data-action="toggle-done" title="Отметить как готовое"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"></polyline></svg></button>`;
            setupDrag(widget);
            setupResize(widget);
            setupWidgetControls(widget);
            applyColor(widget, color);
            workspace.appendChild(widget);
            requestAnimationFrame(() => { autoScaleText(widget); if (!data) { const content = widget.querySelector('.widget-content'); content.focus(); if (type === 'square') document.execCommand('selectAll', false, null); saveToLocal(); } });
        }

        function autoScaleText(el) { requestAnimationFrame(() => { const content = el.querySelector('.widget-content'); if (!content) return; content.style.fontSize = '14px'; const availableArea = content.clientWidth * content.clientHeight; const userMultiplier = parseFloat(el.dataset.userFontMultiplier) || 1; let baseSize = Math.max(9, Math.min(20, Math.sqrt(Math.max(availableArea, 500)) / 18)); let finalSize = baseSize * userMultiplier; content.style.fontSize = `${finalSize.toFixed(2)}px`; let attempts = 0; while (content.scrollHeight > content.clientHeight && finalSize > 8 && attempts < 20) { finalSize -= 0.5; content.style.fontSize = `${finalSize.toFixed(2)}px`; attempts++; } }); }
        function setupDrag(el) { let isDragging = false, offsetX, offsetY; const dragHandle = el.querySelector('.widget-drag-handle'); dragHandle.addEventListener('pointerdown', (e) => { if (e.target.closest('button') || e.target.closest('.controls')) return; isDragging = true; el.style.zIndex = ++highestZIndex; document.querySelectorAll('.widget').forEach(w => w.classList.remove('active')); el.classList.add('active', 'dragging'); autoScaleText(el); const rect = el.getBoundingClientRect(); offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top; try { dragHandle.setPointerCapture(e.pointerId); } catch (err) {} e.preventDefault(); }); dragHandle.addEventListener('pointermove', (e) => { if (!isDragging) return; const workspaceRect = workspace.getBoundingClientRect(); let newX = e.clientX - workspaceRect.left - offsetX; let newY = e.clientY - workspaceRect.top - offsetY; newX = Math.max(-20, Math.min(newX, workspaceRect.width - el.offsetWidth + 20)); newY = Math.max(-20, Math.min(newY, workspaceRect.height - el.offsetHeight + 20)); el.style.left = `${newX}px`; el.style.top = `${newY}px`; const binRect = bin.getBoundingClientRect(); const elRect = el.getBoundingClientRect(); if (elRect.left < binRect.right && elRect.right > binRect.left && elRect.top < binRect.bottom && elRect.bottom > binRect.top) bin.classList.add('drag-over'); else bin.classList.remove('drag-over'); }); dragHandle.addEventListener('pointerup', (e) => { if (!isDragging) return; isDragging = false; el.classList.remove('dragging'); try { dragHandle.releasePointerCapture(e.pointerId); } catch (err) {} if (bin.classList.contains('drag-over')) { el.remove(); bin.classList.remove('drag-over'); } saveToLocal(); }); dragHandle.addEventListener('pointercancel', () => { isDragging = false; el.classList.remove('dragging'); bin.classList.remove('drag-over'); }); }
        function setupResize(el) { const resizer = el.querySelector('.resizer'); let isResizing = false, startX, startY, startWidth, startHeight; resizer.addEventListener('pointerdown', (e) => { isResizing = true; startX = e.clientX; startY = e.clientY; startWidth = el.offsetWidth; startHeight = el.offsetHeight; el.style.zIndex = ++highestZIndex; try { resizer.setPointerCapture(e.pointerId); } catch (err) {} e.preventDefault(); e.stopPropagation(); }); resizer.addEventListener('pointermove', (e) => { if (!isResizing) return; const dx = e.clientX - startX; const dy = e.clientY - startY; const workspaceRect = workspace.getBoundingClientRect(); const maxWidth = workspaceRect.width - el.offsetLeft + 20; const maxHeight = workspaceRect.height - el.offsetTop + 20; el.style.width = `${Math.max(160, Math.min(startWidth + dx, maxWidth))}px`; el.style.height = `${Math.max(140, Math.min(startHeight + dy, maxHeight))}px`; autoScaleText(el); }); resizer.addEventListener('pointerup', (e) => { if (!isResizing) return; isResizing = false; try { resizer.releasePointerCapture(e.pointerId); } catch (err) {} saveToLocal(); }); resizer.addEventListener('pointercancel', () => { isResizing = false; }); }
        function setupWidgetControls(el) { const content = el.querySelector('.widget-content'); const picker = el.querySelector('.color-picker'); el.querySelector('.controls').addEventListener('click', (e) => { const btn = e.target.closest('[data-action]'); if (!btn) return; e.preventDefault(); const action = btn.dataset.action; if (action === 'bold') document.execCommand('bold'); if (action === 'italic') document.execCommand('italic'); if (action === 'underline') document.execCommand('underline'); if (action === 'font-minus') changeFontSize(el, -2); if (action === 'font-plus') changeFontSize(el, 2); if (action === 'toggle-mode') toggleMode(el, btn); if (action === 'delete') el.remove(); saveToLocal(); }); const doneBtn = el.querySelector('.done-btn'); doneBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.toggle('done'); saveToLocal(); }); el.querySelectorAll('.controls button').forEach(btn => btn.addEventListener('pointerdown', (e) => e.preventDefault())); doneBtn.addEventListener('pointerdown', (e) => e.preventDefault()); picker.addEventListener('input', (e) => { applyColor(el, e.target.value); saveToLocal(); }); }
        /// function changeFontSize

function changeFontSize(widget, change) {
    const content = widget.querySelector('.widget-content');
    
    // Обновляем глобальный множитель (для случая без выделения)
    let multiplier = parseFloat(widget.dataset.userFontMultiplier) || 1;
    multiplier += change > 0 ? 0.15 : -0.15;
    multiplier = Math.max(0.4, Math.min(3, multiplier));
    widget.dataset.userFontMultiplier = multiplier;

    const selection = window.getSelection();

    // ── Случай 1: есть выделение ──
    if (selection.rangeCount > 0 && selection.toString().length > 0) {
        const range = selection.getRangeAt(0);

        // Проверяем, что выделение внутри нашего виджета
        if (!content.contains(range.commonAncestorContainer)) {
            autoScaleText(widget);
            return;
        }

        // Определяем текущий размер выделенного текста
        const container = range.startContainer.nodeType === 3
            ? range.startContainer.parentElement
            : range.startContainer;
        const currentSize = parseFloat(window.getComputedStyle(container).fontSize) || 14;
        const newSize = Math.max(8, Math.min(currentSize + change, 72));

        // Оборачиваем выделение в <span> с нужным размером
        try {
            const span = document.createElement('span');
            span.style.fontSize = `${newSize}px`;

            // Если выделение охватывает несколько узлов — используем extractContents
            const fragment = range.extractContents();
            span.appendChild(fragment);
            range.insertNode(span);

            // Восстанавливаем выделение поверх нового span
            selection.removeAllRanges();
            const newRange = document.createRange();
            newRange.selectNodeContents(span);
            selection.addRange(newRange);
        } catch (err) {
            // Если surroundContents падает (выделение через границы блоков) —
            // просто выходим, ничего не делаем
            console.warn('Font resize failed:', err);
        }
    } 
    // ── Случай 2: нет выделения — меняем весь текст ──
    else {
        autoScaleText(widget);
    }
}


        function applyColor(el, hexColor) {
    const mode = el.dataset.mode || 'pastel';
    const type = el.classList.contains('type-paperclip') ? 'paperclip' : 'square';

    const r = parseInt(hexColor.slice(1, 3), 16);
    const g = parseInt(hexColor.slice(3, 5), 16);
    const b = parseInt(hexColor.slice(5, 7), 16);
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    const isDark = yiq < 128;

    el.classList.remove('dark-theme', 'solid-mode');

    if (type === 'paperclip' && hexColor.toLowerCase() === '#ffffff' && mode === 'pastel') {
        el.style.backgroundColor = '#fffdf5';
        el.style.borderColor = '#e0e0e0';
        el.style.color = 'var(--text-dark)';
        el.style.backgroundImage = 'none';
        return;
    }

    if (mode === 'pastel') {
        el.style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.15)`;
        el.style.borderColor = hexColor;                       // ← ЯРКАЯ РАМКА
        el.style.color = 'var(--text-dark)';
        el.style.backgroundImage = 'none';
    } else {
        el.classList.add('solid-mode');
        el.style.backgroundColor = hexColor;
        el.style.borderColor = hexColor;
        
        if (isDark) {
            el.style.color = 'var(--text-light)';
            el.classList.add('dark-theme');
        } else {
            el.style.color = 'var(--text-dark)';
        }

        if (type === 'square') {
            const lighten = (val) => Math.min(255, val + Math.round((255 - val) * 0.25));
            const darken = (val) => Math.max(0, val - Math.round(val * 0.15));
            
            const rL = lighten(r), gL = lighten(g), bL = lighten(b);
            const rD = darken(r), gD = darken(g), bD = darken(b);
            
            el.style.backgroundImage = `linear-gradient(180deg, 
                rgb(${rL}, ${gL}, ${bL}) 0%, 
                rgb(${r}, ${g}, ${b}) 45%, 
                rgb(${rD}, ${gD}, ${bD}) 100%)`;
        } else {
            el.style.backgroundImage = 'none';
        }
    }
}
        function toggleMode(widget, button) { const mode = widget.dataset.mode === 'solid' ? 'pastel' : 'solid'; widget.dataset.mode = mode; button.textContent = mode.toUpperCase(); applyColor(widget, widget.querySelector('.color-picker').value); }
        function getBoardData() { return [...document.querySelectorAll('.widget')].map(widget => ({ type: widget.classList.contains('type-paperclip') ? 'paperclip' : 'square', x: parseFloat(widget.style.left), y: parseFloat(widget.style.top), width: widget.offsetWidth, height: widget.offsetHeight, html: widget.querySelector('.widget-content').innerHTML, color: widget.querySelector('.color-picker').value, mode: widget.dataset.mode, userFontMultiplier: parseFloat(widget.dataset.userFontMultiplier) || 1, done: widget.classList.contains('done') })); }
        function saveToLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(getBoardData())); }
        function loadFromLocal() { try { const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); data.forEach(item => createWidget(item.type, item)); } catch (error) { showToast('Could not load saved notes'); } }
        function exportBoard() {
    const payload = {
        version: '1.0',
        timestamp: new Date().toISOString(),
        widgets: getBoardData()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'daily-tracker-board.json';
    link.click();
    URL.revokeObjectURL(link.href);
}
        function importBoard(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      let data = JSON.parse(e.target.result);
      
      // ── Поддержка обоих форматов ──
      // Старый формат: массив верхнего уровня [ {...}, {...} ]
      // Новый формат: { version, timestamp, widgets: [...] }
      let widgets;
      if (Array.isArray(data)) {
        widgets = data;                     // ← старый формат
      } else if (data && Array.isArray(data.widgets)) {
        widgets = data.widgets;             // ← новый формат
      } else {
        throw new Error('Неверный формат');
      }

      if (widgets.length === 0) {
        showToast('Файл пуст');
        event.target.value = '';
        return;
      }

      const count = widgets.length;
      if (confirm(`Загружено ${count} блоков. Заменить текущую доску?`)) {
        // Очищаем доску
        document.querySelectorAll('.widget').forEach(el => el.remove());
        highestZIndex = 10;
        // Создаём все блоки
        widgets.forEach(w => createWidget(w.type, w));
        // Сохраняем в localStorage уже в новом формате
        saveToLocal();
        showToast(`📥 Импортировано ${count} блоков`);
      }
    } catch (err) {
      showToast('❌ Ошибка: неверный файл');
      console.error('Import error:', err);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}
